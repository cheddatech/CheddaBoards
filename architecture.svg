<svg viewBox="0 0 1200 400" width="1200" height="400" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#17171c"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6"/>
    </marker>
    <filter id="goldglow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F0C64A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="400" fill="#0B0B0D"/>
  <rect x="0" y="0" width="1200" height="400" fill="url(#dots)"/>

  <!-- eyebrow -->
  <text x="48" y="66" fill="#7d8188" font-size="13" letter-spacing="5">ARCHITECTURE</text>
  <rect x="48" y="76" width="32" height="3" fill="#F0C64A"/>
  <text x="1152" y="66" fill="#3f434a" font-size="12" letter-spacing="2" text-anchor="end">cheddaboards.com</text>

  <!-- BOX 1 · YOUR GAME  (x48 y120 w280 h170, stepped corners s=8) -->
  <path d="M 64 120 H 312 h 8 v 8 h 8 v 8 V 258 v 8 h -8 v 8 h -8 H 64 h -8 v -8 h -8 v -8 V 136 v -8 h 8 v -8 h 8 Z"
        fill="#0e0e11" stroke="#6b6f76" stroke-width="2"/>
  <rect x="55" y="127" width="266" height="156" fill="none" stroke="#6b6f76" stroke-width="1" opacity="0.22"/>
  <text x="188" y="158" fill="#C9CDD3" font-size="17" font-weight="bold" letter-spacing="3" text-anchor="middle">YOUR GAME</text>
  <line x1="72" y1="172" x2="304" y2="172" stroke="#6b6f76" stroke-width="1" opacity="0.5"/>
  <text x="188" y="200" fill="#9aa0a6" font-size="13" text-anchor="middle">Godot 4 / 3.6 SDK</text>
  <text x="188" y="224" fill="#9aa0a6" font-size="13" text-anchor="middle">Unity SDK</text>
  <text x="188" y="248" fill="#9aa0a6" font-size="13" text-anchor="middle">anything that speaks HTTP</text>

  <!-- arrow 1 -->
  <line x1="336" y1="205" x2="420" y2="205" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="188" fill="#C9CDD3" font-size="12" letter-spacing="2" text-anchor="middle">HTTPS</text>
  <text x="378" y="228" fill="#7d8188" font-size="11" text-anchor="middle">REST · API key</text>

  <!-- BOX 2 · REST PROXY  (x430 y120 w300 h170) -->
  <path d="M 446 120 H 714 h 8 v 8 h 8 v 8 V 258 v 8 h -8 v 8 h -8 H 446 h -8 v -8 h -8 v -8 V 136 v -8 h 8 v -8 h 8 Z"
        fill="#0e0e11" stroke="#6b6f76" stroke-width="2"/>
  <rect x="437" y="127" width="286" height="156" fill="none" stroke="#6b6f76" stroke-width="1" opacity="0.22"/>
  <text x="580" y="158" fill="#C9CDD3" font-size="17" font-weight="bold" letter-spacing="3" text-anchor="middle">REST PROXY</text>
  <line x1="454" y1="172" x2="706" y2="172" stroke="#6b6f76" stroke-width="1" opacity="0.5"/>
  <text x="580" y="200" fill="#9aa0a6" font-size="13" text-anchor="middle">verifies OAuth tokens (JWKS)</text>
  <text x="580" y="224" fill="#9aa0a6" font-size="13" text-anchor="middle">rate limits · translates REST</text>
  <text x="580" y="248" fill="#9aa0a6" font-size="13" text-anchor="middle">holds the verifier identity</text>
  <!-- chip -->
  <rect x="514" y="109" width="132" height="22" fill="#0B0B0D" stroke="#6b6f76" stroke-width="1.5"/>
  <text x="580" y="124" fill="#9aa0a6" font-size="11" letter-spacing="1" text-anchor="middle">YOU BUILD THIS</text>

  <!-- arrow 2 with verifier gate -->
  <line x1="738" y1="205" x2="768" y2="205" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="804" y1="205" x2="822" y2="205" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="781" y="177" fill="#C9CDD3" font-size="11" letter-spacing="1" text-anchor="middle">IC CALLS</text>
  <!-- padlock -->
  <rect x="772" y="195" width="28" height="20" fill="#0B0B0D" stroke="#6EE86E" stroke-width="2"/>
  <path d="M 780 195 v -5 a 6 6 0 0 1 12 0 v 5" fill="none" stroke="#6EE86E" stroke-width="2"/>
  <circle cx="786" cy="204" r="2.5" fill="#6EE86E"/>
  <!-- leader + caption -->
  <line x1="786" y1="217" x2="786" y2="318" stroke="#6EE86E" stroke-width="1" opacity="0.5" stroke-dasharray="3 4"/>
  <text x="786" y="340" fill="#6EE86E" font-size="12.5" text-anchor="middle">only calls signed by the VERIFIER principal can mint sessions</text>

  <!-- BOX 3 · ICP CANISTER  (x832 y120 w320 h170) -->
  <path d="M 848 120 H 1136 h 8 v 8 h 8 v 8 V 258 v 8 h -8 v 8 h -8 H 848 h -8 v -8 h -8 v -8 V 136 v -8 h 8 v -8 h 8 Z"
        fill="#111008" stroke="#F0C64A" stroke-width="2" filter="url(#goldglow)"/>
  <rect x="839" y="127" width="306" height="156" fill="none" stroke="#F0C64A" stroke-width="1" opacity="0.28"/>
  <text x="992" y="158" fill="#F0C64A" font-size="17" font-weight="bold" letter-spacing="3" text-anchor="middle">ICP CANISTER</text>
  <line x1="856" y1="172" x2="1128" y2="172" stroke="#F0C64A" stroke-width="1" opacity="0.4"/>
  <text x="992" y="200" fill="#C9CDD3" font-size="13" text-anchor="middle">main.mo — auth · scores · anti-cheat</text>
  <text x="992" y="224" fill="#C9CDD3" font-size="13" text-anchor="middle">achievements · moderation</text>
  <text x="992" y="248" fill="#C9CDD3" font-size="13" text-anchor="middle">state lives on-chain</text>
  <!-- chip -->
  <rect x="944" y="109" width="96" height="22" fill="#0B0B0D" stroke="#F0C64A" stroke-width="1.5"/>
  <text x="992" y="124" fill="#F0C64A" font-size="11" letter-spacing="1" text-anchor="middle">THIS REPO</text>
</svg>
